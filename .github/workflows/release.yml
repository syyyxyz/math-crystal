# Push a tag such as v0.1.0 (matching the version in Cargo.toml) to build
# Linux and Windows binaries and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: cargo test --locked --lib
      - run: cargo build --locked --release
      - name: Package
        run: |
          name="math-crystal-$VERSION-${{ matrix.target }}"
          mkdir -p "$name/licenses"
          cp LICENSE README.md "$name/"
          cp assets/fonts/*.txt "$name/licenses/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/math-crystal.exe "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            cp target/release/math-crystal "$name/"
            cp packaging/linux/math-crystal.desktop "$name/"
            cp assets/icon.png "$name/math-crystal.png"
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum math-crystal-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" math-crystal-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "Math-crystal $GITHUB_REF_NAME" --generate-notes
